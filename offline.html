<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Jolly Space Cow</title>
  <link rel="icon" href="public/favicon.ico">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      background: #07070f; color: #f1f1f1; font-family: 'Outfit', -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }
    .offline-msg { text-align: center; margin-bottom: 2rem; }
    .offline-msg h1 {
      font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 900; letter-spacing: -0.03em;
      margin-bottom: 0.5rem; background: linear-gradient(135deg, #5ba3f5, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .offline-msg p { color: rgba(241,241,241,0.4); font-size: clamp(0.85rem, 1.5vw, 1rem); line-height: 1.5; }
    #game-container {
      position: relative; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; overflow: hidden; background: #0a0a18;
      box-shadow: 0 0 60px rgba(91, 163, 245, 0.1);
    }
    #game-canvas { display: block; }
    .score-display {
      position: absolute; top: 12px; right: 16px; font-size: 14px;
      font-weight: 600; color: rgba(255,255,255,0.5); font-family: 'Outfit', monospace;
    }
    .game-hint { text-align: center; margin-top: 1.5rem; color: rgba(241,241,241,0.25); font-size: 13px; }
    .retry-btn {
      display: inline-block; margin-top: 1.5rem; padding: 0.6rem 1.4rem;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px; color: rgba(241,241,241,0.5); text-decoration: none;
      font-size: 13px; transition: all 0.2s;
    }
    .retry-btn:hover { color: #fff; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div class="offline-msg">
    <div style="font-size:3rem; margin-bottom:1rem;">🐄💫</div>
    <h1>Lost in Space</h1>
    <p>You're offline. While you wait for a signal,<br>help the Space Cow dodge asteroids!</p>
  </div>

  <div id="game-container">
    <canvas id="game-canvas" width="600" height="200"></canvas>
    <div class="score-display">
      <div id="score">0</div>
      <div style="font-size:10px; color:rgba(255,255,255,0.2); text-align:right;">HI <span id="hi-score">0</span></div>
    </div>
  </div>

  <p class="game-hint" id="game-hint">Press SPACE or tap to jump</p>
  <a class="retry-btn" href="javascript:location.reload()">↻ Try Reconnecting</a>

  <script src="assets/js/offline.js"></script>
</body>
</html>
